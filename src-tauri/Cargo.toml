[package]
name = "ntp-client"
version = "0.1.0"
description = "NTP 時間同步客戶端"
authors = ["whes1015"]
edition = "2021"
license = "AGPL-3.0"
default-run = "ntp-client"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["tray-icon"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-updater = "2.10.1"
tauri-plugin-single-instance = "2.4.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
chrono = "0.4.44"
libc = "0.2.185"
tokio = { version = "1.52.1", features = ["time"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
flate2 = "1.1.9"
lazy_static = "1.5.0"
dirs = "6.0.0"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2.5.3"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.5.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Time", "Win32_Security", "Win32_UI_Shell", "Win32_System_Registry", "Win32_System_Threading"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
